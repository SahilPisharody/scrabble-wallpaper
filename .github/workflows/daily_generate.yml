name: Generate Daily Scrabble Wallpaper

on:
  schedule:
    # Runs every day at 05:00 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run wallpaper generator
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python generate_wallpaper.py

      - name: Commit and push generated wallpaper
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_wallpaper.jpg
          git commit -m "Update daily wallpaper" || exit 0
          git push
