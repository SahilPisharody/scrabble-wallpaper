name: Generate Daily Scrabble Wallpaper

on:
  schedule:
    # Runs every hour at minute 0, between 6 AM and 11 PM UTC
    - cron: '0 6-23 * * *'
  workflow_dispatch: # Allows manual triggers

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate Wallpaper
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python generate_wallpaper.py

      - name: Commit and push updated image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_wallpaper.jpg
          git commit -m "Update hourly wallpaper" || exit 0
          git push
